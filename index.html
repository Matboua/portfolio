    <!-- Theme initialization to prevent flash -->
    <script>
      (function() {
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const override = localStorage.getItem('portfolio-theme-override');
        document.documentElement.dataset.theme = override === 'dark' || override === 'light'
          ? override
          : isDark ? 'dark' : 'light';
      })();
    </script>
